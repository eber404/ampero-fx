name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_run:
    workflows: ['Sync Hotone manuals']
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or pages-* tag to deploy
        required: false
        default: master
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out current branch
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'master' || github.ref }}

      - name: Check out requested revision
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Tag deployed revision
        env:
          TAG_NAME: pages-${{ github.run_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Deploy GitHub Pages $TAG_NAME" HEAD
          git push origin "$TAG_NAME"
